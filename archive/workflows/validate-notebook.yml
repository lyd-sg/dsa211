name: Validate DSA211 revised notebook

on:
  pull_request:
    paths:
      - 'online_shoppers_revised.ipynb'
      - 'data/uci_468.csv'
      - 'requirements.txt'
      - '.github/workflows/validate-notebook.yml'
  push:
    branches:
      - main
      - 'analysis/**'
    paths:
      - 'online_shoppers_revised.ipynb'
      - 'data/uci_468.csv'
      - 'requirements.txt'
      - '.github/workflows/validate-notebook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'nbconvert>=7' 'nbclient>=0.10' 'nbformat>=5'
      - name: Run notebook with actual UCI data
        run: |
          jupyter nbconvert --to notebook --execute online_shoppers_revised.ipynb \
            --ExecutePreprocessor.timeout=1200 \
            --output online_shoppers_revised_executed.ipynb
      - name: Print computed project summary
        run: |
          python - <<'PY'
          import nbformat
          book = nbformat.read('online_shoppers_revised_executed.ipynb', as_version=4)
          for cell in book.cells:
              for output in cell.get('outputs', []):
                  if output.get('output_type') == 'stream':
                      text = output.get('text', '')
                      if 'PROJECT SUMMARY' in text:
                          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsa211-online-shoppers-executed
          path: online_shoppers_revised_executed.ipynb
          retention-days: 30
