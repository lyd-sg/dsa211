name: Verify current DSA211 PRD v3.7 evidence (no retraining)

on:
  push:
    branches:
      - main
    paths:
      - 'online_shoppers_prd_v3_7.ipynb'
      - 'scripts/run_verify_prd_v3_7.py'
      - 'PRD_v3.7.md'
      - 'README.md'
      - '.github/workflows/verify-prd-v3-7.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-existing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current repository version
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification-only dependencies
        run: python -m pip install nbformat==5.11.1 pandas==3.0.6
      - name: Validate saved v3.7 notebook, CV lineage and numerical evidence
        run: python scripts/run_verify_prd_v3_7.py --verify
