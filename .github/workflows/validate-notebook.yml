name: Validate DSA211 revised notebook

on:
  pull_request:
    paths:
      - 'online_shoppers_revised.ipynb'
      - 'requirements.txt'
      - '.github/workflows/validate-notebook.yml'
  push:
    branches:
      - 'analysis/phase-2-core-notebook'
    paths:
      - 'online_shoppers_revised.ipynb'
      - 'requirements.txt'
      - '.github/workflows/validate-notebook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'nbconvert>=7' 'nbclient>=0.10' 'nbformat>=5'
      - name: Run notebook with actual UCI data
        run: |
          jupyter nbconvert --to notebook --execute online_shoppers_revised.ipynb \
            --ExecutePreprocessor.timeout=1200 \
            --output online_shoppers_revised_executed.ipynb
      - name: Verify results and print final summary
        run: |
          python - <<'PY'
          import nbformat
          book = nbformat.read('online_shoppers_revised_executed.ipynb', as_version=4)
          assert len(book.cells) == 36
          errors = [(i, output) for i, cell in enumerate(book.cells)
                    for output in cell.get('outputs', [])
                    if output.get('output_type') == 'error']
          assert not errors, str(errors[:2])
          final = book.cells[-1]
          print('=== FINAL NOTEBOOK SUMMARY ===')
          for out in final.get('outputs', []):
              if out.get('output_type') == 'stream':
                  print(out.get('text', ''))
          assert any('PROJECT SUMMARY' in str(o.get('text', ''))
                     for o in final.get('outputs', []))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsa211-online-shoppers-executed
          path: online_shoppers_revised_executed.ipynb
          retention-days: 30
