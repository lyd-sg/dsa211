name: Audit PRD v3.5 curated notebook (no model execution)

on:
  push:
    branches:
      - analysis/prd-v3-5-presentation
    paths:
      - 'online_shoppers_prd_v3_5.ipynb'
      - 'PRD_v3.5.md'
      - 'scripts/verify_prd_v3_5_presentation.py'
      - '.github/workflows/verify-prd-v3-5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  presentation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook format validator (no model dependencies)
        run: python -m pip install nbformat==5.10.4
      - name: Verify presentation against frozen v3.4 outputs
        run: python scripts/verify_prd_v3_5_presentation.py
      - name: Commit isolated v3.5 audit evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/prd_v3_5/presentation_audit.json
          git diff --cached --quiet || git commit -m "audit: verify PRD v3.5 presentation without model execution [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
