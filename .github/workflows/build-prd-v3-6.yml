name: Verify DSA211 v3.6 notebook
on:
  push:
    branches: [analysis/prd-v3-6-sequential-one-se]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/execute_prd_v3_6.py
