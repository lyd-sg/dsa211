name: Commit executed DSA211 notebook (one-time)

on:
  push:
    branches:
      - 'analysis/save-executed-notebook-20261027'
    paths:
      - '.github/workflows/commit-executed-review.yml'

permissions:
  contents: write

jobs:
  execute-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'nbconvert>=7' 'nbclient>=0.10' 'nbformat>=5'
      - name: Execute original notebook with actual source data
        run: |
          jupyter nbconvert --to notebook --execute online_shoppers_revised.ipynb \
            --ExecutePreprocessor.timeout=1200 \
            --output online_shoppers_revised_executed.ipynb
          mv online_shoppers_revised_executed.ipynb online_shoppers_revised.ipynb
      - name: Validate actual embedded plots and tables
        run: |
          python - <<'PY'
          import nbformat
          nb = nbformat.read('online_shoppers_revised.ipynb', as_version=4)
          code = [c for c in nb.cells if c.cell_type == 'code']
          output = [o for c in code for o in c.get('outputs', [])]
          images = sum('image/png' in o.get('data', {}) for o in output)
          tables = sum('text/html' in o.get('data', {}) for o in output)
          errors = [o for o in output if o.output_type == 'error']
          print(f'cells={len(nb.cells)}, code={len(code)}, outputs={len(output)}, image/png={images}, text/html={tables}, errors={len(errors)}')
          assert len(code) == 16 and len(output) >= 12, 'Expected executed output missing'
          assert images >= 5, 'Expected chart images not embedded'
          assert tables >= 3, 'Expected tables not embedded'
          assert not errors, 'Notebook execution contains errors'
          assert all(isinstance(c.execution_count, int) for c in code), 'Unexecuted code cell found'
          PY
      - name: Commit executed notebook to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online_shoppers_revised.ipynb
          git diff --cached --stat
          git commit -m 'docs(notebook): embed executed PRD v2 tables and plots'
          git push origin HEAD:analysis/save-executed-notebook-20261027
