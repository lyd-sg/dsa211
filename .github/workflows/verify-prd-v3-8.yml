name: Verify v3.8 EDA redesign without model retraining
on:
  pull_request:
    branches: [main]
    paths:
      - 'online_shoppers_prd_v3_8.ipynb'
      - 'scripts/verify_prd_v3_8.py'
      - '.github/workflows/verify-prd-v3-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-eda-and-frozen-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific and notebook verification dependencies
        run: python -m pip install numpy pandas scipy scikit-learn matplotlib statsmodels nbformat nbclient ipykernel ipython
      - name: Validate EDA rendering, source calculations and unchanged model evidence
        run: python scripts/verify_prd_v3_8.py --run-eda
